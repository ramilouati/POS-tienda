{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page_title %}
    <title>{{ page_title }} | Grocery Point Of Sale System</title>
    {% else %}
    <title>Grocery Point Of Sale System</title>
    {% endif %}
    <link rel="stylesheet" href="{% static 'posApp/assets/default/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/bootstrap/css/bootstrap.min.css' %}">

    <!-- plugins:css -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/mdi/css/materialdesignicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/css/vendor.bundle.base.css' %}">
    <!-- endinject -->
    <!-- Plugin css for this page -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/flag-icon-css/css/flag-icon.min.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/jvectormap/jquery-jvectormap.css' %}">
    <!-- End plugin css for this page -->
    <!-- Layout styles -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/css/demo/style.css' %}">
    <!-- End layout styles -->
    <link rel="shortcut icon" href="{% static 'posApp/assets/material-admin/images/favicon.png' %}" />
    <script src="{% static 'posApp/assets/default/js/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'posApp/assets/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'posApp/assets/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'posApp/assets/bootstrap/js/popper.min.js' %}"></script>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 10px;
            width: 80%;
            position: relative;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out;
        }

        .grid-item:hover img {
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .grid-item:hover .overlay {
            opacity: 1;
        }

        .item1 {
            grid-row: span 3;
        }

        .item2 {
            grid-row: span 2;
        }

        .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            grid-column: span 3;
            background: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
            text-decoration: none;
            padding: 15px;
            text-align: center;
        }

        .start-btn:hover {
            background: #218838;
        }

    </style>
</head>

<body>
    <script src="{% static 'posApp/assets/material-admin/js/preloader.js' %}"></script>

    <div class="grid-container">
        <div class="grid-item item1">
            <img src="{% static 'posApp/assets/images/stock.jpg' %}" alt="Stock Image">
            <div class="overlay">📦 Gestion des stocks</div>
        </div>
        <div class="grid-item item2">
            <img src="{% static 'posApp/assets/images/inventory.jpg' %}" alt="Inventory">
            <div class="overlay">📊 Suivi des inventaires</div>
        </div>
        <div class="grid-item">
            <img src="{% static 'posApp/assets/images/pos.jpg' %}" alt="POS System">
            <div class="overlay">🛒 Système de point de vente</div>
        </div>
        <div class="grid-item">
            <img src="{% static 'posApp/assets/images/barcode.jpg' %}" alt="Barcode Scanner">
            <div class="overlay">🔍 Scanneur de codes-barres</div>
        </div>
        <div class="grid-item">
            <img src="{% static 'posApp/assets/images/cashier.jpg' %}" alt="Cash Register">
            <div class="overlay">💰 Caisse et paiements</div>
        </div>

        <a href="{% url 'list_business' %}" class="start-btn">🚀 Commencer</a>
    </div>

</body>

</html>
